map $http_user_agent $block_bot {
    default           0;
    ""                1;
    ~*python-requests 1;
    ~*python/         1;
    ~*scrapy          1;
    ~*^curl/          1;
    ~*wget            1;
    ~*Go-http-client  1;
    ~*java/           1;
    ~*libwww-perl     1;
    ~*HttpClient      1;
    # 帯域を食いやすいスクレイパー / AI クローラ（Googlebot / Bingbot は対象外）
    ~*Bytespider      1;
    ~*PetalBot        1;
    ~*DotBot          1;
    ~*MJ12bot         1;
    ~*SemrushBot      1;
    ~*AhrefsBot       1;
    ~*DataForSeoBot   1;
    ~*ClaudeBot       1;
    ~*GPTBot          1;
    ~*CCBot           1;
    ~*Amazonbot       1;
    ~*meta-externalagent 1;
}

# レート制限キー: Cloudflare が付与する実クライアント IP。
# ヘッダ欠落時のみ接続元（通常は Render 内部）にフォールバックする。
map $http_cf_connecting_ip $rate_limit_key {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# ブラウザ UA を名乗るが Sec-Fetch-Dest が無い = 安価なスクレイパー。
# 本物の Chrome / Firefox / Edge / Safari はナビゲーション時に必ず付ける。
# 検索エンジン・SNS プレビューは付けないので先に除外する（IP 分散には効く）。
# "$uri:$http_sec_fetch_dest:$http_user_agent" のため欠落時は `::` になる。
map "$uri:$http_sec_fetch_dest:$http_user_agent" $spoofed_browser {
    default 0;
    ~*(Googlebot|Google-InspectionTool|Storebot-Google|AdsBot-Google) 0;
    ~*(bingbot|BingPreview|adidxbot) 0;
    ~*(Applebot|DuckDuckBot|Baiduspider|Slurp) 0;
    ~*Yandex 0;
    ~*(facebookexternalhit|Twitterbot|LinkedInBot|Slackbot|Discordbot) 0;
    ~*(WhatsApp|TelegramBot|Pinterest) 0;
    ~*(ChatGPT-User|OAI-SearchBot) 0;
    ~*^/[^/]+/participant/.*::.*(Chrome/|CriOS/|Firefox/|FxiOS/|Edg/|EdgiOS/) 1;
    ~*^/[^/]+/participant/.*::.*Version/[0-9.]+.*Safari/ 1;
}

limit_req_zone $rate_limit_key zone=general:10m rate=60r/m;
limit_req_zone $rate_limit_key zone=participant:10m rate=10r/m;
limit_req_zone $rate_limit_key zone=sitemap:5m rate=6r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Render はコンテナへ localhost でプロキシするため、127.0.0.1 も信頼する。
    # これを入れないと $remote_addr が常に 127.0.0.1 のままになり、
    # ログ上の client と real_ip 系のフォールバックが全員同一になる。
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    if ($block_bot) {
        return 403;
    }

    if ($spoofed_browser) {
        return 403;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        text/xml
        application/xml
        image/svg+xml;

    # Render ヘルスチェック（ボット制限の対象外）。
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 存在しない URL はルート 404.html を 404 ステータスで返す。
    # （/404/ への rewrite は実体が無いため @404 と location / の間で無限ループし 500 になる）
    error_page 404 /404.html;

    # sitemap はファイルが大きく連打されると egress が増えるため厳しめに制限する。
    location ~ ^/sitemap(-[0-9]+)?\.xml$ {
        limit_req zone=sitemap burst=3 nodelay;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    location = /sitemap-index.xml {
        limit_req zone=sitemap burst=3 nodelay;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # 旧出場者詳細 URL。実体は無くクローラの 404 連打源のため 410 + noindex。
    location ~ ^/[^/]+/participant_detail(/|$) {
        limit_req zone=participant burst=8 nodelay;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 410;
    }

    # 出場者詳細は巡回スクレイピングの主対象のため、一般より厳しめに制限する。
    # 先頭セグメントはアプリ側のロケールプレフィックス（/[lang]/...）を想定。
    location ~ ^/[^/]+/participant/ {
        limit_req zone=participant burst=8 nodelay;
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header X-Robots-Tag "noindex, follow" always;
    }

    # 拡張子なし URL（例: /{lang}/2026/top）をディレクトリ index.html へ解決する。
    location / {
        limit_req zone=general burst=40 nodelay;
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # /_astro は Cloudflare Pages（assetsPrefix）へ移設済み。
    # Render 上に残った古い参照の打ちは 404（Docker イメージからも削除）。
}
